[versions]
# Android Gradle Plugin 9.5.1: latest stable, needs Gradle 9.6.0+, supports API 37.
# https://developer.android.com/build/releases/gradle-plugin
agp = "9.5.1"
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
# Compose BOM 2026.09.00 pins every androidx.compose.* library to a matching version.
# https://developer.android.com/jetpack/compose/bom/bom-mapping
compose-bom = "2026.09.00"
# https://developer.android.com/jetpack/androidx/releases/activity
activity = "1.13.0"
# https://developer.android.com/jetpack/androidx/releases/lifecycle
lifecycle = "2.11.0"
# https://developer.android.com/jetpack/androidx/releases/core
core = "1.19.1"
# https://github.com/Kotlin/kotlinx.coroutines/releases
coroutines = "1.10.2"
# Room 3 (package androidx.room3): KSP-only, coroutine-first. Latest stable 3.0.3.
# https://developer.android.com/jetpack/androidx/releases/room3
room = "3.0.3"
# KSP 2.3+ is versioned on its own, no longer "<kotlin>-<ksp>". 2.3.14 is the latest release
# and works with Kotlin 2.4.21 and AGP 9. https://github.com/google/ksp/releases
ksp = "2.3.14"
# Bundled SQLite driver: ships its own SQLite so every phone behaves the same.
# https://developer.android.com/jetpack/androidx/releases/sqlite
sqlite = "2.7.1"
# Drag-to-reorder lists for Compose. Apache-2.0. https://github.com/Calvin-LL/Reorderable
reorderable = "3.1.0"
junit = "4.13.2"
# https://developer.android.com/jetpack/androidx/releases/test
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Compose UI tests pull in Espresso 3.5.0, which crashes on newer Android; 3.7.0 fixes that.
androidx-test-espresso = "3.7.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }

androidx-room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# The Compose compiler ships with Kotlin, so it must match the Kotlin version.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room3", version.ref = "room" }
