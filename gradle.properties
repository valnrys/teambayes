# Gradle needs room for the Android and Kotlin compilers; the default heap runs out.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Use AndroidX libraries (already the default since AGP 9, stated for clarity).
android.useAndroidX=true
# Keep the app installed after `connectedDebugAndroidTest`. By default the test task
# uninstalls it when it finishes, and uninstalling deletes everything the app has stored:
# on a phone in real use, that would be every player and every game. (Tests themselves run
# on an in-memory database; see TeamBayesTestRunner. Still, never run them on a phone that
# holds real data.)
android.injected.androidTest.leaveApksInstalledAfterRun=true
